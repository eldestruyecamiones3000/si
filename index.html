<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LOGO</h1>
        <nav>
            <a href="#inicio">inicio</a>
            <a href="#galeria">galeria</a>
            <a href="#contacto">contacto</a>
        </nav>
    </header>
    <section id="inicio">
        <img src="./images/person.png" alt="">
        <h2>Hello! I'm a photographer.</h2>
        <a href="#galeria">Here's some of my work</a>
    </section>

    <section id="galeria">
        <div class="imagen" data-content="Bosque">
            <img src="./images/bosque.jpg" alt="Bosque">
        </div>
        <div class="imagen" data-content="Flores">
            <img src="./images/flores.jpg" alt="Flores">
        </div>
        <div class="imagen" data-content="Gotas">
            <img src="./images/gotas.jpg" alt="Gotas">
        </div>
        <div class="imagen" data-content="Laptop">
            <img src="./images/laptop.jpg" alt="Laptop">
        </div>
        <div class="imagen" data-content="Montañas">
            <img src="./images/montañas.jpg" alt="Montañas">
        </div>
        <div class="imagen" data-content="Libro">
            <img src="./images/libro.jpg" alt="Libro">
        </div>
        <div class="imagen" data-content="playa">
            <img src="./images/playa.jpg" alt="Playa">
        </div>

    </section>

    <section id="contacto">
        <form action="/enviar" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required></textarea>

        <button type="submit">Enviar</button>
</form>

    </section>
    
</body>
</html>
